name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7

      - name: Configurar Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Descomprimir proyecto
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "No se encontró el ZIP del proyecto"
            exit 1
          fi

          echo "Descomprimiendo: $ZIP_FILE"
          rm -rf nomina_cfe_android
          unzip -q "$ZIP_FILE"

          if [ ! -f "nomina_cfe_android/settings.gradle" ]; then
            echo "No se encontró el proyecto Android"
            find . -maxdepth 3 -type f
            exit 1
          fi

      - name: Verificar Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"

          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"

          echo "Android SDK 35 disponible"

      - name: Configurar Gradle 8.7
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'

      - name: Compilar APK
        working-directory: nomina_cfe_android
        run: gradle :app:assembleDebug --stacktrace

      - name: Preparar APK
        run: |
          cp nomina_cfe_android/app/build/outputs/apk/debug/app-debug.apk \
          Revisor-Nomina-CFE-2026.apk

      - name: Subir APK
        uses: actions/upload-artifact@v7
        with:
          name: Revisor-Nomina-CFE-2026
          path: Revisor-Nomina-CFE-2026.apk
